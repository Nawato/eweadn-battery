id = "nawato/eweadn-battery"
name = "EWEADN Battery"
version = "1.0.1"
plugin_api = 52
author = "nawato"
license = "MIT"
icon = "battery-4"
description = "Battery, polling, DPI and button controls for the EWEADN S9 mouse."
dependencies = ["python3"]

[[widget]]
id = "battery"
entry = "widget.luau"

[[service]]
id = "monitor"
entry = "service.luau"

[[panel]]
id = "control"
entry = "panel.luau"
width = 460
height = 640
placement = "attached"
position = "auto"
open_near_click = true
