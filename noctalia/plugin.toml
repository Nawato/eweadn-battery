id = "nawato/eweadn-linux-control"
name = "EWEADN Linux Control"
version = "2.0.0"
plugin_api = 52
author = "nawato"
license = "MIT"
icon = "battery-4"
description = "Battery, polling, DPI and button controls for EWEADN mice on Linux."
dependencies = ["python3"]

[[widget]]
id = "battery"
entry = "widget.luau"

[[service]]
id = "monitor"
entry = "service.luau"

[[panel]]
id = "control"
entry = "panel.luau"
width = 460
height = 640
placement = "attached"
position = "auto"
open_near_click = true
